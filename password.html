<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Unlock Book | AniDubs.in</title><style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f7f3eb;
  color: #171717;
}

.card {
  width: 100%;
  max-width: 380px;
  padding: 28px 22px;
  background: #fff;
  border: 1px solid #e4dccd;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 10px 35px #00000012;
}

.logo {
  width: 55px;
  height: 55px;
  margin: 0 auto 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #c5a059;
  color: #111;
  border-radius: 14px;
  font-size: 26px;
  font-weight: bold;
}

h1 {
  font-family: Georgia, serif;
  font-size: 25px;
  margin-bottom: 10px;
}

p {
  color: #777;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 22px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d8cbb5;
  border-radius: 9px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #c5a059;
}

button {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border: none;
  border-radius: 9px;
  background: #171717;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

#message {
  margin-top: 14px;
  font-size: 13px;
  color: #b3261e;
}

.back {
  display: inline-block;
  margin-top: 20px;
  color: #806221;
  text-decoration: none;
  font-size: 13px;
}
</style></head><body><main class="card">  <div class="logo">A</div>  <h1>Unlock Your Book</h1>  <p>
    AniDubs.in Voice Artist Training Book<br>
    Enter the password provided to you.
  </p>  <form id="passwordForm">
    <input
      id="password"
      type="password"
      placeholder="Enter book password"
      autocomplete="current-password"
      required
    ><button type="submit">UNLOCK BOOK →</button>

  </form>  <div id="message" role="status"></div><a class="back" href="index.html">← Back to Home</a>

</main><script>
document.getElementById("passwordForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  message.textContent = "Checking password...";

  try {
    const response = await fetch("/api/unlock-book", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ password: password })
    });

    if (!response.ok) {
      message.textContent = "Incorrect password. Please try again.";
      return;
    }

    const result = await response.json();

    if (result.success) {
      window.location.href = result.redirect || "book.html";
    } else {
      message.textContent = "Incorrect password. Please try again.";
    }
  } catch (error) {
    message.textContent =
      "Password service is not connected yet. Please try again later.";
  }
});
</script></body>
</html>
